[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asuka"
version = "0.1.0"
description = "A miniature SLIME-style distributed RL training system for learning Ray, SGLang, Megatron, and MoE RL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "ty>=0.0.63",
]

[tool.hatch.build.targets.wheel]
packages = ["asuka"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
